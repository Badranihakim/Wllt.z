<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 840" width="100%" height="100%" style="background-color:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title / Caption -->
  <text x="460" y="820" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Gambar 1. Use case diagram wllt.z</text>

  <!-- System Boundary Box -->
  <rect x="230" y="25" width="460" height="760" rx="10" ry="10" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
  <text x="460" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Sistem wllt.z</text>

  <!-- ================= ACTOR: PENGGUNA (LEFT) ================= -->
  <g transform="translate(95, 390)">
    <!-- Head -->
    <circle cx="0" cy="-35" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
    <!-- Body -->
    <line x1="0" y1="-19" x2="0" y2="24" stroke="#1e293b" stroke-width="2.2" />
    <!-- Arms -->
    <line x1="-24" y1="-6" x2="24" y2="-6" stroke="#1e293b" stroke-width="2.2" />
    <!-- Legs -->
    <line x1="0" y1="24" x2="-20" y2="60" stroke="#1e293b" stroke-width="2.2" />
    <line x1="0" y1="24" x2="20" y2="60" stroke="#1e293b" stroke-width="2.2" />
    <!-- Label -->
    <text x="0" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Pengguna</text>
  </g>

  <!-- ================= ACTOR: GOOGLE (RIGHT) ================= -->
  <g transform="translate(825, 650)">
    <!-- Head -->
    <circle cx="0" cy="-35" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
    <!-- Body -->
    <line x1="0" y1="-19" x2="0" y2="24" stroke="#1e293b" stroke-width="2.2" />
    <!-- Arms -->
    <line x1="-24" y1="-6" x2="24" y2="-6" stroke="#1e293b" stroke-width="2.2" />
    <!-- Legs -->
    <line x1="0" y1="24" x2="-20" y2="60" stroke="#1e293b" stroke-width="2.2" />
    <line x1="0" y1="24" x2="20" y2="60" stroke="#1e293b" stroke-width="2.2" />
    <!-- Label -->
    <text x="0" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Google</text>
  </g>

  <!-- ================= RELATION LINES (PENGGUNA -> USE CASES) ================= -->
  <!-- Pengguna Center: (95, 390) -->
  <!-- Target Oval Left Edge: (460 - 140) = 320 -->
  <g stroke="#64748b" stroke-width="1.4">
    <line x1="95" y1="390" x2="320" y2="90" />   <!-- Keluar / ganti akun -->
    <line x1="95" y1="390" x2="320" y2="140" />  <!-- Tambah dan kelola dompet -->
    <line x1="95" y1="390" x2="320" y2="190" />  <!-- Catat transaksi -->
    <line x1="95" y1="390" x2="320" y2="240" />  <!-- Ubah transaksi -->
    <line x1="95" y1="390" x2="320" y2="290" />  <!-- Hapus transaksi -->
    <line x1="95" y1="390" x2="320" y2="340" />  <!-- Transfer antardompet -->
    <line x1="95" y1="390" x2="320" y2="390" />  <!-- Lihat riwayat dan cari -->
    <line x1="95" y1="390" x2="320" y2="440" />  <!-- Atur anggaran bulanan -->
    <line x1="95" y1="390" x2="320" y2="490" />  <!-- Lihat dasbor -->
    <line x1="95" y1="390" x2="320" y2="540" />  <!-- Lihat statistik -->

    <!-- Cloud / Google Features -->
    <line x1="95" y1="390" x2="320" y2="595" />  <!-- Masuk dengan Google -->
    <line x1="95" y1="390" x2="320" y2="645" />  <!-- Hubungkan Google Drive -->
    <line x1="95" y1="390" x2="320" y2="695" />  <!-- Sinkronisasi data 2 arah -->
    <line x1="95" y1="390" x2="320" y2="745" />  <!-- Buka catatan di Sheets -->
  </g>

  <!-- ================= RELATION LINES (GOOGLE -> USE CASES) ================= -->
  <!-- Google Center: (825, 650) -->
  <!-- Target Oval Right Edge: (460 + 140) = 600 -->
  <g stroke="#64748b" stroke-width="1.4">
    <line x1="825" y1="650" x2="600" y2="595" />  <!-- Masuk dengan Google -->
    <line x1="825" y1="650" x2="600" y2="645" />  <!-- Hubungkan Google Drive -->
    <line x1="825" y1="650" x2="600" y2="695" />  <!-- Sinkronisasi data 2 arah -->
    <line x1="825" y1="650" x2="600" y2="745" />  <!-- Buka catatan di Sheets -->
  </g>

  <!-- ================= USE CASE OVALS (CENTERED AT X=460) ================= -->
  <!-- RX=140, RY=19 -->

  <!-- 1. Keluar / ganti akun -->
  <g transform="translate(460, 90)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Keluar / ganti akun</text>
  </g>

  <!-- 2. Tambah dan kelola dompet -->
  <g transform="translate(460, 140)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Tambah dan kelola dompet</text>
  </g>

  <!-- 3. Catat transaksi -->
  <g transform="translate(460, 190)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Catat transaksi</text>
  </g>

  <!-- 4. Ubah transaksi -->
  <g transform="translate(460, 240)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Ubah transaksi</text>
  </g>

  <!-- 5. Hapus transaksi -->
  <g transform="translate(460, 290)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Hapus transaksi</text>
  </g>

  <!-- 6. Transfer antardompet -->
  <g transform="translate(460, 340)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Transfer antardompet</text>
  </g>

  <!-- 7. Lihat riwayat dan cari -->
  <g transform="translate(460, 390)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Lihat riwayat dan cari</text>
  </g>

  <!-- 8. Atur anggaran bulanan -->
  <g transform="translate(460, 440)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Atur anggaran bulanan</text>
  </g>

  <!-- 9. Lihat dasbor -->
  <g transform="translate(460, 490)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Lihat dasbor</text>
  </g>

  <!-- 10. Lihat statistik -->
  <g transform="translate(460, 540)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#f8fafc" stroke="#475569" stroke-width="1.4" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#0f172a">Lihat statistik</text>
  </g>

  <!-- 11. Masuk dengan Google -->
  <g transform="translate(460, 595)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#1e3a8a">Masuk dengan Google</text>
  </g>

  <!-- 12. Hubungkan Google Drive -->
  <g transform="translate(460, 645)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#1e3a8a">Hubungkan Google Drive</text>
  </g>

  <!-- 13. Sinkronisasi data 2 arah (Smart Merge) -->
  <g transform="translate(460, 695)">
    <ellipse cx="0" cy="0" rx="140" ry="21" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="-1" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">Sinkronisasi data 2 arah</text>
    <text x="0" y="13" text-anchor="middle" font-size="10" fill="#0284c7">(Smart Merge)</text>
  </g>

  <!-- 14. Buka catatan di Sheets -->
  <g transform="translate(460, 745)">
    <ellipse cx="0" cy="0" rx="140" ry="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
    <text x="0" y="5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Buka catatan di Sheets</text>
  </g>

</svg>